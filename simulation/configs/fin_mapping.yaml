fin_mapping:
  # Identity mapping — USD hinge axes corrected at authoring time (feature 006).
  # positive drive target → positive deflection per controller convention.
  # No runtime index swap or sign negation needed.
  # Ref: specs/006-refactor-fin-physics/research.md RQ-2
  joint_source_indices: [0, 1, 2, 3]
  joint_signs: [1.0, 1.0, 1.0, 1.0]

  # Controller mixing weights (canonical fin order: Right, Left, Fwd, Aft)
  # Right+Left fins (indices 0,1) produce pitch (FRD +X lift)
  # Fwd+Aft fins (indices 2,3) produce roll (FRD -Y / +Y lift)
  # Differential pattern provides secondary yaw authority from 3° cant angle
  pitch_weights: [1.0, 1.0, 0.0, 0.0]
  roll_weights: [0.0, 0.0, 1.0, 1.0]
  yaw_weights: [-1.0, 1.0, -1.0, 1.0]

  # Historical calibration data (kept for reference; weights above supersede)
  generated_by: calibrate_fin_mapping.py
  measurement:
    thrust: 0.7
    deflection: 0.65
    settle_steps: 45
    hold_steps: 90
    per_fin:
    - fin_index: 0
      delta_omega_roll: 1.1982789480825886
      delta_omega_pitch: 3.095032585049921
      delta_omega_yaw: 7.859373325855813
      dominant_axis: yaw
      dominant_sign: 1.0
    - fin_index: 1
      delta_omega_roll: -0.9012346422532573
      delta_omega_pitch: -2.915243017290777
      delta_omega_yaw: 7.813928360493264
      dominant_axis: yaw
      dominant_sign: 1.0
    - fin_index: 2
      delta_omega_roll: -1.8651842629769817
      delta_omega_pitch: 1.0731833104146062
      delta_omega_yaw: -7.802684550731101
      dominant_axis: yaw
      dominant_sign: -1.0
    - fin_index: 3
      delta_omega_roll: -2.3493210828164592
      delta_omega_pitch: -1.2569235440241755
      delta_omega_yaw: -7.859602694957175
      dominant_axis: yaw
      dominant_sign: -1.0
