# Asset metadata for EDF Drone v2 USD scene
# Maps USD prim names/paths to simulation indices and physical properties.
# YAML is authoritative; USD must be validated against this via validate_usd_mass_props.py
# Jet-vane force convention: chord = EDF flow axis (+Z_FRD), normal = hinge_axis x chord.

asset:
  name: edf_drone_v2
  usd_path: "simulation/isaac/assets/usd/drone_v2_physics.usd"  # relative to repo root

  # Root body link name (ArticulationRootAPI prim); lives at /<defaultPrim>/Body
  body_link_name: "Body"

  # Fin link names in canonical order: +X, +Y, -X, -Y
  # Fins are siblings of Body under the Drone defaultPrim
  fin_link_names:
    - "FwdFin"    # +X fin (forward fin)
    - "RightFin"  # +Y fin (right fin)
    - "AftFin"    # -X fin (rear fin)
    - "LeftFin"   # -Y fin (left fin)

  # Revolute joint names (parent: Body → child: fin); live at /<defaultPrim>/Body/<joint>
  fin_joint_names:
    - "joint_FwdFin"
    - "joint_RightFin"
    - "joint_AftFin"
    - "joint_LeftFin"

  # Hinge axes for each fin joint in body-FRD frame (unit vectors)
  # Positive deflection follows the right-hand rule about the hinge axis.
  hinge_axes:
    # 2026-09-14: builder confirms hinges run along radial vane spans.
    # Previous tangential joints rotated the thin CAD plates in their planes.
    - [1.0, 0.0, 0.0]   # FwdFin: outward +X, positive angle -> -roll, +yaw
    - [0.0, 1.0, 0.0]   # RightFin: outward +Y, positive angle -> -pitch, +yaw
    - [-1.0, 0.0, 0.0]  # AftFin: outward -X, positive angle -> +roll, +yaw
    - [0.0, -1.0, 0.0]  # LeftFin: outward -Y, positive angle -> +pitch, +yaw

  # Joint limits [min_rad, max_rad] — must match USD PhysicsRevoluteJoint limits
  joint_limits:
    - [-0.262, 0.262]   # FwdFin, 15°
    - [-0.262, 0.262]   # RightFin, 15°
    - [-0.262, 0.262]   # AftFin, 15°
    - [-0.262, 0.262]   # LeftFin, 15°

  # Neutral center-of-pressure positions in body-FRD (m), relative to Body's
  # link origin. Runtime caches these in each fin's local frame at startup,
  # then follows the measured fin-link pose when applying external forces.
  fin_cop_positions:
    - [0.04, 0.0, 0.10]    # FwdFin COP: forward-offset, at EDF exit plane z
    - [0.0, 0.04, 0.10]    # RightFin COP
    - [-0.04, 0.0, 0.10]   # AftFin COP
    - [0.0, -0.04, 0.10]   # LeftFin COP

  # Chord directions in body-FRD frame at zero deflection.
  # Chord is the EDF flow direction for every vane.
  fin_chord_directions:
    - [0.0, 0.0, 1.0]   # FwdFin chord: along EDF flow
    - [0.0, 0.0, 1.0]   # RightFin chord
    - [0.0, 0.0, 1.0]   # AftFin chord
    - [0.0, 0.0, 1.0]   # LeftFin chord

  # Normal directions in body-FRD frame at zero deflection.
  # normal = hinge_axis x chord; force ON the vane is -F_n * normal.
  fin_normal_directions:
    - [0.0, -1.0, 0.0]  # FwdFin: tangential -Y
    - [1.0, 0.0, 0.0]   # RightFin: tangential +X
    - [0.0, 1.0, 0.0]   # AftFin: tangential +Y
    - [-1.0, 0.0, 0.0]  # LeftFin: tangential -X

  # EDF thrust axis in body-FRD frame (exhaust exits downward = +z in FRD)
  edf_thrust_axis: [0.0, 0.0, 1.0]

  # Rotor spin axis in body-FRD frame (rotor spins around body z-axis)
  rotor_spin_axis: [0.0, 0.0, 1.0]

  # Landing legs are compound collision shapes on Body, so PhysX reports their
  # normal force on the Body rigid link. Any fin-link contact is unsafe.
  landing_contact_body: "Body"
  unsafe_contact_links:
    - "FwdFin"
    - "RightFin"
    - "AftFin"
    - "LeftFin"
