# Wind/gusts, sensor noise and the full 10 mm COM offset, composed without
# allowing a source file to disable or weaken another selected source.
disturbances:
  enabled: true
  wind:
    enabled: true
    steady_vector:
    - 2.0
    - 0.5
    - 0.0
  gust:
    enabled: true
    magnitude: 5.0
    duration: 0.5
    interval:
    - 5.0
    - 15.0
  body_drag:
    cd: 1.0
    reference_area: 0.02
  com_offset:
    enabled: true
    range:
    - - -0.01
      - -0.01
      - -0.01
    - - 0.01
      - 0.01
      - 0.01
  sensor_noise:
    enabled: true
    position_std: 0.01
    velocity_std: 0.05
    attitude_std: 0.005
    angular_velocity_std: 0.02
