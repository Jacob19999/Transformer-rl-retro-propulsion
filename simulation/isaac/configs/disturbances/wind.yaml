# Wind disturbance configuration
# Source: config_schema contract

disturbances:
  enabled: true

  wind:
    enabled: true
    steady_vector: [2.0, 0.5, 0.0]  # m/s, world frame (x=right, y=up, z=back in Isaac)

  gust:
    enabled: true
    magnitude: 5.0               # m/s
    duration: 0.5                # s
    interval: [5.0, 15.0]        # s, min/max between gusts

  body_drag:
    cd: 1.0                      # source: estimate
    reference_area: 0.02         # m², source: estimate

  com_offset:
    enabled: false
    range: [[-0.005, -0.005, -0.005], [0.005, 0.005, 0.005]]  # m

  sensor_noise:
    enabled: false
    position_std: 0.01           # m
    velocity_std: 0.05           # m/s
    attitude_std: 0.005          # rad
    angular_velocity_std: 0.02   # rad/s
