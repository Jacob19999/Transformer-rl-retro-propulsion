# WITMOTION WTGAHRS1 measurement model for tvc_env/dynamics/imu_model.py.
#
# Provenance tags on every value:
#   [MANUAL]      WTGAHRS1 user manual v0707 (tools/WITMotion IMU.pdf). A user manual: no noise,
#                 bias or accuracy tables, and it does not name the MEMS chip.
#   [DATASHEET]   WTGAHRS1 datasheet v20-0615 (tools/WITMotion IMU 2.pdf), section 3.1 and 5.1. Marketing-style
#                 figures ("stability", "accuracy"): no test conditions, no noise density. The built-in
#                 WT901B uses an AK8963 magnetometer, i.e. an MPU-9250-class part; the WT901B sheet itself
#                 is not in the repo, so chip-level noise figures below remain estimates.
#   [ESTIMATE]    engineering estimate for this part class, see the note on the line
#   [PLACEHOLDER] typical consumer-MEMS magnitude, NOT measured on this unit.
#                 Replace with a bench Allan-variance fit:
#                   python tools/imu_allan_variance.py <static_log.csv> --rate-hz 200
#                 (>= 6 h static log, EDF off; repeat with EDF spinning for vibration).
#
# Every error term is redrawn per episode = one power cycle of a randomly drawn unit.
imu:
  sample_rate_hz: 200.0        # [DATASHEET 5.2.9] max output rate; factory default 10 Hz. At 9600 baud (default) 200 Hz is impossible;
                               # 200 Hz x 44 B (acc+gyro+angle+mag, 11 B frames [DATASHEET 5.1]) needs ~88 kbit/s, so >= 115200 baud
                               # (76 % loaded; adding the quaternion frame makes it 95 %)
  bandwidth_hz: 20.0           # [MANUAL 2.4.9] default digital bandwidth; first-order low-pass modelled
  latency_s: 0.005             # [PLACEHOLDER] on-sensor processing + ~3 ms UART frame at 115200 baud
  rate_truth: pose             # simulator: feed the gyro the rate implied by the true pose change; the engine's reported
                               # angular velocity misses the pose corrections applied during pad contact (see imu_model.py)

  gyro:
    range_dps: 2000            # [DATASHEET 3.1] +-2000 dps (also the manual's default)
    resolution_dps: 0.061      # [DATASHEET 5.1.3] raw/32768*2000
    noise_density_dps_rthz: 0.01     # [PLACEHOLDER] typical MEMS angle random walk
    bias_instability_dps: 0.05       # [DATASHEET 3.1] "gyro stability 0.05 deg/s", read as the Allan floor
    bias_correlation_time_s: 100.0   # [PLACEHOLDER]
    rate_random_walk_dps_rt_s: 0.0005  # [PLACEHOLDER]
    turn_on_bias_dps: 0.1      # [PLACEHOLDER] residual after the manual's 2.3.3 gyro auto-calibration
    scale_factor_pct: 1.0      # [PLACEHOLDER]
    misalignment_mrad: 5.0     # [PLACEHOLDER] cross-axis coupling incl. mounting error (~0.3 deg)
    g_sensitivity_dps_per_g: 0.1     # [PLACEHOLDER] EDF thrust load leaks into the rate channel
    tco_dps_per_k: 0.02        # [ESTIMATE] WIT temperature compensation is undocumented; raw MPU-class parts are
                               # far worse (~0.2 dps/K), so this assumes the module compensates most of it

  accel:
    range_g: 16                # [DATASHEET 3.1] +-16 g (also the manual's default)
    resolution_g: 0.000488     # [DATASHEET 5.1.2] raw/32768*16 g
    noise_density_ug_rthz: 300 # [PLACEHOLDER] typical MEMS accelerometer
    bias_instability_mg: 5.0   # [DATASHEET 3.1] "accel stability 0.005 g"
    bias_correlation_time_s: 100.0   # [PLACEHOLDER]
    random_walk_ug_rt_s: 0.0
    turn_on_bias_mg: 2.0       # [MANUAL 2.3.1, p.16] residual after accelerometer calibration: X -0.0020 g, Y 0.0024 g
                               # (the [DATASHEET 3.1] "accuracy 0.01 g" would be ~0.6 deg of tilt and contradicts the 0.05 deg static claim)
    scale_factor_pct: 1.0      # [PLACEHOLDER]
    misalignment_mrad: 5.0     # [PLACEHOLDER]
    tco_mg_per_k: 0.3          # [ESTIMATE] see gyro tco_dps_per_k

  thermal:
    # [ESTIMATE] same generic electronics warm-up for all three profiles: power-up within +-5 K of the
    # factory calibration point, then +5 K of self-heating with a 5 min time constant.
    start_spread_k: 5.0
    self_heating_k: 5.0
    warmup_tau_s: 300.0

  nav:
    # Unaided strapdown navigation, opt-in (mission control: "Inertial" position source). The solution
    # starts from the true pad position and velocity; there is no aiding (baro, optical flow, GNSS).
    enabled: false
    initial_position_std_m: 0.0    # [ASSUMED] start position surveyed / known
    initial_velocity_std_m_s: 0.0  # [ASSUMED] vehicle at rest on the pad

  attitude:
    # [ASSUMED] Mahony gains; WIT's onboard Kalman filter is proprietary. This is the single most
    # consequential unknown: a thrust-vectored vehicle's accelerometer always reads along the body
    # axis, so any accelerometer aiding pulls the tilt estimate toward level during sustained tilted
    # flight (sweep in docs/imu_model.md: kp=1 -> 10 deg error after 5 s of a 10 deg tilt, kp=0.1 ->
    # 4 deg). Low gains trade that for slower gyro-bias correction. Fit it from a flight/rig log.
    kp: 0.1
    ki: 0.002
    integral_limit_dps: 5.0
    accel_gate: 0.3            # accelerometer ignored unless | |f| - g | <= 0.3 g
    initial_tilt_error_deg: 0.05 # [DATASHEET 3.1] X/Y angle accuracy 0.05 deg; a static figure, in-flight error will be larger
    yaw:
      mode: gyro               # 6-axis algorithm [MANUAL 2.3.4]; "magnetometer" = 9-axis. The EDF's
                               # 120 A bus is expected to disturb the magnetometer, so gyro is the default.
      gain: 0.5                # 1/s heading correction (magnetometer mode)
      initial_error_deg: 1.0   # [PLACEHOLDER] operator alignment of the heading frame at launch (gyro mode)
      mag_turn_on_deg: 1.0     # [DATASHEET 3.1] Z-axis angle accuracy 1 deg after magnetic calibration (magnetometer mode)
      mag_sigma_deg: 3.0       # [PLACEHOLDER] slow disturbance near the motor bus (magnetometer mode)
      mag_correlation_time_s: 30.0
