# Landing task configuration
# Source: config_schema contract

task:
  name: landing
  target_position: [0.0, 0.0, 0.0]   # m, landing pad center
  episode_length_s: 30.0

  spawn:
    # Final / un-curricularized spawn box used at eval and after the staged
    # curriculum reaches its last stage. Altitude raised from 8-12 m to
    # 16-20 m: Phase-1 diagnosis showed peak descent ~9.5 m/s leaves only
    # ~1 s from 8 m altitude — too short for the policy to null lateral
    # spawn velocity (up to ±1 m/s) AND correct toward the pad. Higher
    # spawn altitude buys the action policy more time for both.
    position_range: [[-2.0, -2.0, 16.0], [2.0, 2.0, 20.0]]  # m
    velocity_range: [[-1.0, -1.0, -2.0], [1.0, 1.0, 0.0]]   # m/s (biased downward)
    attitude_range: [[-0.1, -0.1, -0.2], [0.1, 0.1, 0.2]]   # rad
    curriculum:
      enabled: true
      mode: staged
      success_window_size: 1024     # rolling window of terminal events for success-fraction
      # Rule 5 spawn curriculum (CLAUDE.md), upgraded from linear-anneal to
      # feedback-driven staged advancement. Diagnostic evidence: linear
      # anneal in run ppo_landing_seed0_20260426_192920 reached its best
      # mean_pad_distance (1.56 m) at step 2.75 M (mid-curriculum) and then
      # *regressed* to 1.89 m by 5 M as the spawn box widened to ±2 m,
      # indicating the policy did not retain lateral guidance under the
      # full task. Staged mode dwells at each width until success becomes
      # consistent before widening, so the policy never "graduates" past a
      # difficulty it has not yet mastered. ``advance_success_fraction`` is
      # the fraction of recent terminal events that must be successful
      # landings (LANDED + on-pad + soft-enough per success criteria below).
      # Physics review: July's eval had 100% crashes, zero successes. Start
      # with short, slow, pre-spooled approaches to sample real soft contacts;
      # increase height and velocity before the full cold-rotor task. These
      # reset priors are explicit curriculum, with no guidance/action wrapper.
      stages:
        # Review v2: zero sustained stage-0 successes by 835,584 steps;
        # bounce accounting also revealed false soft-touchdown labels. Begin
        # with real foot-clearance approaches before the existing 0.7–1.2 m
        # stage. Every stage still uses the same contact/speed/pad gates.
        - position_range: [[-0.05, -0.05, 0.34], [0.05, 0.05, 0.50]]
          velocity_range: [[-0.02, -0.02, -0.05], [0.02, 0.02, 0.0]]
          attitude_range: [[-0.005, -0.005, -0.05], [0.005, 0.005, 0.05]]
          initial_motor_omega_fraction: 0.934
          min_steps: 100000
          max_steps: 0
          advance_success_fraction: 0.60
          min_terminations: 256
        - position_range: [[-0.1, -0.1, 0.7], [0.1, 0.1, 1.2]]
          velocity_range: [[-0.05, -0.05, -0.1], [0.05, 0.05, 0.0]]
          attitude_range: [[-0.01, -0.01, -0.05], [0.01, 0.01, 0.05]]
          initial_motor_omega_fraction: 0.934
          min_steps: 100000
          max_steps: 0
          advance_success_fraction: 0.60
          min_terminations: 256
        - position_range: [[-0.5, -0.5, 2.0], [0.5, 0.5, 4.0]]
          velocity_range: [[-0.2, -0.2, -0.5], [0.2, 0.2, 0.0]]
          attitude_range: [[-0.03, -0.03, -0.1], [0.03, 0.03, 0.1]]
          initial_motor_omega_fraction: 0.934
          min_steps: 150000
          max_steps: 0
          advance_success_fraction: 0.50
          min_terminations: 256
        - position_range: [[-1.0, -1.0, 6.0], [1.0, 1.0, 10.0]]
          velocity_range: [[-0.4, -0.4, -1.0], [0.4, 0.4, 0.0]]
          initial_motor_omega_fraction: 0.934
          min_steps: 200000
          max_steps: 0
          advance_success_fraction: 0.40
          min_terminations: 256
        - position_range: [[-2.0, -2.0, 16.0], [2.0, 2.0, 20.0]]
          min_steps: 500000
          max_steps: 0
          advance_success_fraction: 1.0
          min_terminations: 256

  contact:
    dwell_frames: 15
    min_contact_force: 1.0             # N

  reward:
    # July failed-run diagnostic: zero landings and mean rewards ~-5 to -6.
    # Old position cost alone at 18 m: -.05 * 18 * 900 = -810, larger
    # than a -200 crash. A 30 s hover could be worse than early suicide.
    # Revised example envelope (18 m, 2 m XY, .15 rad tilt, 1 rad/s,
    # .9 rotor fraction, .1 rad fins, 1 rad/s fin rates) costs -77.67 per
    # 900 steps; a 1 m/s descent adds -4.5. Terminals dominate this budget.
    alive_bonus: 0.01
    position_error: -0.003
    horizontal_position_error: -0.01
    horizontal_closure: 0.05
    attitude_error: -0.10
    angular_velocity: -0.03
    control_effort: -0.002
    control_rate: -0.001
    vertical_speed_shaping: -0.01
    # physics_review/ppo_landing_seed0_20260910_162004: stage success fell
    # to zero by 2M steps. Add bounded descent tracking and stronger attitude
    # feedback. The same 30 s hover example now costs -151.47 (including
    # descent tracking), still below the -200 crash and +475 soft on-pad event.
    landing_descent_tracking: -0.05
    delta_v_cost: -0.01
    crash_penalty: -200.0
    off_pad_landing_penalty: -150.0
    # Review v3 at 131k: reward +8.71/step but only 6.84% rolling success.
    # Fast on-pad contacts harvested up to +225 partial terminal reward.
    # This exceeds that payout, making every hard terminal landing negative.
    hard_landing_penalty: -250.0
    touchdown_softness: 25.0
    pad_accuracy: 200.0
    landing_success: 250.0

  descent_reward:
    touchdown_root_height: 0.3125   # m; neutral Body origin minus lowest USD collision point
    touchdown_speed: 0.15          # m/s, below the unchanged 0.25 m/s success gate
    max_descent_speed: 1.0         # m/s, explicit reward reference only
    braking_acceleration: 0.8     # m/s^2, below ~1.44 m/s^2 nominal surplus lift

  success:
    state: LANDED
    max_pad_distance: 0.5             # m from pad center
    # Landings harder than this no longer earn the +250 success bonus
    # (touchdown_softness still pays exp(-v) for a soft impact regardless,
    # and off_pad_landing_penalty still applies if the lateral miss is too
    # large). Tightened from the implicit "any speed counts" so the
    # policy is forced to learn a real terminal flare; the prior 5 M run
    # reported max_touchdown_speed 0.347 m/s — slightly above this gate.
    max_touchdown_speed: 0.25         # m/s

  termination:
    max_tilt: 1.57                    # rad (90°)
    max_altitude_error: 30.0          # m, vertical error from pad altitude before fail-stop
    max_impact_speed: 3.0             # m/s downward at first PhysX contact, source: safety estimate
    max_tilt_at_contact: 0.5          # rad, source: landing-envelope estimate
    max_angular_rate_at_contact: 3.0  # rad/s, source: landing-envelope estimate
    crash: true
