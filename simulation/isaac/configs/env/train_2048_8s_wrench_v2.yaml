# 2026-09-15 force-frame correction; see docs/momentum_landing_2026-09-14.md.
# Installed Isaac Lab 2.3.2 composer position kernel used a world lever arm
# with local force and overwrote supplied torque. Explicit world COM moments
# now pass real heading-covariance and +/-10mm thrust/COM impulse tests.
# Previous 100.139M run reached warm stage-2 mastery at 84.410M, then full cold
# task stayed at 0% success. Preserve that earlier actor as initialization;
# fresh critic/optimizer and additional rotor-state curriculum. No action
# controller, thrust floor, or prescribed descent speed; same energy/rewards.
# Full task remains 16-20m, +/-2m XY, cold rotor, strict soft/on-pad contact.
# Old one-time throttle-head initialization ablation failed (0% stage-0 soft
# success at 10.224M); do not use that initializer for this experiment.
