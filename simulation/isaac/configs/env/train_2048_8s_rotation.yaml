# Sept 15, 2026: whole-flight body rotation and coupled midpoint integration.
# User-approved provisional soft limits: roll/pitch 90 deg/s, yaw 180 deg/s.
# Diagnostic: 12.058M warm 16-20m evaluation peaked at 33-36 rad/s; full
# cold task still 0% success. Test18 also found native articulation explicit
# Coriolis amplified transverse rate squared 114x in 2s at +/-40 rad/s.
# Coupled midpoint, external forces once, 480Hz resolves this amplification;
# policy remains 30Hz, real contact dwell remains .125s. See Sept15 journal.
# Transfer actor only: reward/physics changed, so critic/optimizer reset.
# No rate clamp, scripted trajectory, PID wrapper, throttle floor, or reduced H.
# Rate observations already contain true+configured sensor-noise FRD p/q/r.
# New cost integrates bounded max-axis exceedance (1-limit/abs(rate)) at
# physics dt. Weight -1 costs at most 30 over a 30s episode. Remove old
# unbounded per-policy-step norm: at 40 rad/s it alone cost 360 over 30s.
# Example 30s envelope: 18m height, 2m XY, .15rad tilt, 1rad/s fin motion,
# 2500W electrical, 10m/s2 propulsion costs <=181.77 including worst-case
# rotation (30), versus -200 crash and +475 exact on-pad soft touchdown.
# This is a soft preference; cold rotor transients may exceed provisional
# limits. Peak/travel/excess/time-above are reported for all and soft landings.
# The full task remains 16-20m, +/-2m XY, cold rotor. Hardware is planned 8S.
