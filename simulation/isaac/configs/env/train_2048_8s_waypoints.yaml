# Sept 15: user requested adverse-condition/inverted recovery and spline
# waypoint missions with timed hover (default 2s) and fly-through points.
# New task contract: 43 observations (28 battery-aware landing + 15 mission).
# Actor prefix transfer only; new critic/optimizer/curriculum, direct PPO actions.
# Phase progression is mission state, not a controller. Real contact is required.
# Landing early cannot collect landing rewards or count as mission success.
# Inverted airborne states are allowed; contact tilt/speed/rate gates unchanged.
# 480Hz combined gyro/body midpoint, TGS external force once; 30Hz policy.
# Test18: native explicit body p^2+q^2 grew 114x at 40rad/s; corrected <1.01x.
# Potential shaping is gamma*Phi(next)-Phi(previous), Phi=-remaining route
# length, zero only at absorbing terminations. Gamma must equal PPO gamma.
# Reward budget: at most 120 rotation + 120 path + ~233 electrical + 186
# propulsive impulse + 57 attitude + 13 servo + 8 time costs over 120s
# in the stated 3500W/15.5m/s2 envelope, versus -1000 crash / +2200 landing.
# Hard contact penalty exceeds the +1200 partial landing rewards.
# Full eval uses the uncurricularized 25-100m, +/-100m XY, inverted-inclusive
# attitude box, +/-360deg/s roll/pitch and +/-720deg/s yaw initial rates.
# These extreme starts are research coverage, not a claim all are recoverable.
