# Mission plant: physics and dynamics sections that convex missions fly
# (mission_control.models.vane_model_overrides, braking_envelopes).
# Momentum-bounded coupled-jet vanes, no artificial damper, the torque-limited
# motor, and the coupled Cayley gyro integration with PhysX external forces
# applied once per step (which that integration needs).
physics:
  enable_gyroscopic_forces: true
  max_angular_velocity_deg_s: 3600.0
  enable_external_forces_every_iteration: false
dynamics:
  body_angular_damping: 0.0
  coupled_jet:
    enabled: true
    residual_swirl_fraction: 0.1
    shaft_power_at_max_w: 3072.0
    exit_position_frd: [0, 0, 0.05]
  gyro_integration: coupled_cayley
  # Torque-limited motor (plant audit, 2026-09-26). tau_motor is the spool
  # response the ESC asks for; the motor applies at most Kt I_max, with
  # Kt = 60 / (2 pi KV). That is 0.76 N m for the planned 4075 KV1500 at the
  # 120 A ESC limit (legacy 6S, KV1850 at 150 A: 0.77 N m). With the brake
  # disabled (EDF ESC practice), zero throttle applies no torque: the rotor
  # coasts on its aerodynamic drag, shaft_power_at_max / omega_max
  # (omega / omega_max)^2 (0.47 N m at hover, a ~1.7 s coast time constant).
  # Unbounded, the 0.15 s lag stopped the rotor on disarm with 5.2 N m on the
  # body, which spun every landed vehicle at 430-710 deg/s on the pad (Isaac
  # missions addd8752dc7c, fa66253416c8); a cold spool-up drew up to 12 N m.
  motor_torque_limit:
    enabled: true
    max_torque_nm: 0.76
    zero_throttle_brake: false
  # Intake momentum ("ram") drag, F = -mdot v_rel at the duct inlet (physics
  # review 2026-09-29). Static thrust only counts the momentum the jet leaves
  # with; the air the intake swallows arrives at the vehicle's air-relative
  # velocity and is turned onto the duct axis. At hover (mdot ~0.3 kg/s) that
  # is 0.3 N per m/s crosswise, ~10x the body's form drag at 1 m/s. The inlet
  # lip is the top of the USD body mesh, 0.11 m above the Body origin (0.10 m
  # above the COM), so a crosswind also pitches the vehicle away from it.
  inlet_momentum_drag:
    enabled: true
    inlet_position_frd: [0.0, 0.0, -0.11]
