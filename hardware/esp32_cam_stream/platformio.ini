; ESP32-CAM (AI-Thinker) JPEG streamer over UART0 (CP2102 adapter).
; Build:  pio run -d hardware/esp32_cam_stream
; Flash:  python hardware/flash_camera.py   (IO0 -> GND while flashing)
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
